# Local Demo edge: the role an Ingress plays in a cluster. One browser origin;
# each /api/ prefix goes to the service that owns it, the rest to the
# frontend. The prefixes are the same set as the Vite development proxy
# (Project/Frontend/vite.config.ts), and nothing else of any service is
# reachable from the browser.
#
# Docker's resolver and variables let the edge start before the services and
# answer 502 for one that is down, instead of refusing to start.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Memory photos: 10 MB file plus multipart overhead (memory-service limit).
    client_max_body_size 12m;
    # The planner can wait on several weather lookups.
    proxy_read_timeout 120s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/planner {
        set $upstream recommendation-service:8083;
        proxy_pass http://$upstream;
    }

    location /api/recommendations/pack {
        set $upstream recommendation-service:8083;
        proxy_pass http://$upstream;
    }

    location /api/trails {
        set $upstream trail-service:8082;
        proxy_pass http://$upstream;
    }

    location /api/users/me/gear {
        set $upstream user-service:8081;
        proxy_pass http://$upstream;
    }

    location /api/memories {
        set $upstream memory-service:8085;
        proxy_pass http://$upstream;
    }

    location /api/plans {
        set $upstream plan-service:8086;
        proxy_pass http://$upstream;
    }

    location /api/ {
        return 404;
    }

    location / {
        set $upstream frontend:8080;
        proxy_pass http://$upstream;
    }
}
