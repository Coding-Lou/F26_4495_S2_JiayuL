# Outdoor Trip Companion: copy for the Keycloak login theme
# (docs/features/002-authentication.md, section 21.7).
#
# Only the messages that differ from the parent theme are listed. Every other
# string is the parent's English default.
#
# Format notes: values go through java.text.MessageFormat, so an apostrophe is
# written twice (''). Characters outside ASCII are written as \\uXXXX escapes.

# ---------------------------------------------------------------------------
# Every page
# ---------------------------------------------------------------------------

# The document title. The parent uses one title for all pages.
loginTitle=Outdoor Trip Companion

# The header: the wordmark and, from 1024px, the product line beside the form.
# Never the realm id.
loginTitleHtml=<span class="otc-wordmark">Outdoor Trip Companion</span><p class="otc-product-line">From “Where should I go?” to “I’m ready to hike.”</p>

# Shared links.
backToLogin=Back to sign in
backToApplication=Back to Outdoor Trip Companion

# ---------------------------------------------------------------------------
# Sign in
# ---------------------------------------------------------------------------
loginAccountTitle=Sign in
doLogIn=Sign in
noAccount=New here?
doForgotPassword=Forgot password?

# One message for a wrong username and for a wrong password.
invalidUserMessage=Incorrect username or password. Check both and try again.
accountTemporarilyDisabledMessage=Incorrect username or password. Check both and try again.

# ---------------------------------------------------------------------------
# Create account
# ---------------------------------------------------------------------------
registerTitle=Create your account
# Both the link on the sign-in page and the action on the registration page.
doRegister=Create account
# The parent prints its own asterisk before this text; the stylesheet hides it.
requiredFields=Fields marked * are required.
usernameExistsMessage=This username is already taken.
emailExistsMessage=This email is already registered.
invalidPasswordConfirmMessage=The two passwords don''t match.

# ---------------------------------------------------------------------------
# Error page
# ---------------------------------------------------------------------------
errorTitle=We couldn''t sign you in

# Messages that name protocol details are replaced with one plain sentence.
invalidRequestMessage=Sign-in couldn''t be completed. Go back and try again.
invalidParameterMessage=Sign-in couldn''t be completed. Go back and try again.
missingParameterMessage=Sign-in couldn''t be completed. Go back and try again.
invalidRedirectUriMessage=Sign-in couldn''t be completed. Go back and try again.
clientNotFoundMessage=Sign-in couldn''t be completed. Go back and try again.
clientDisabledMessage=Sign-in couldn''t be completed. Go back and try again.
realmNotEnabledMessage=Sign-in couldn''t be completed. Go back and try again.
unknownLoginRequesterMessage=Sign-in couldn''t be completed. Go back and try again.
loginRequesterNotEnabledMessage=Sign-in couldn''t be completed. Go back and try again.
bearerOnlyMessage=Sign-in couldn''t be completed. Go back and try again.
standardFlowDisabledMessage=Sign-in couldn''t be completed. Go back and try again.
implicitFlowDisabledMessage=Sign-in couldn''t be completed. Go back and try again.
invalidAccessCodeMessage=Sign-in couldn''t be completed. Go back and try again.
invalidCodeMessage=Sign-in couldn''t be completed. Go back and try again.
sessionNotActiveMessage=Sign-in couldn''t be completed. Go back and try again.
failedToProcessResponseMessage=Sign-in couldn''t be completed. Go back and try again.
unexpectedErrorHandlingRequestMessage=Sign-in couldn''t be completed. Go back and try again.
unexpectedErrorHandlingResponseMessage=Sign-in couldn''t be completed. Go back and try again.
unexpectedErrorRetrievingTokenMessage=Sign-in couldn''t be completed. Go back and try again.

# An attempt that ran out of time or was reopened mid-flow.
cookieNotFoundMessage=Your sign-in attempt has expired. Go back to Outdoor Trip Companion and start again.
loginTimeout=Your sign-in attempt timed out. Sign-in starts again from the beginning.
expiredCodeMessage=Your sign-in attempt timed out. Please sign in again.

# ---------------------------------------------------------------------------
# Page expired
# ---------------------------------------------------------------------------
# Rendered by this theme's own login-page-expired.ftl, which offers one action.
pageExpiredTitle=This page has expired
pageExpiredMsg1=Your sign-in attempt timed out.
# A key of this theme, not of the parent: the label of the single link.
pageExpiredRestart=Start again

# ---------------------------------------------------------------------------
# Sign-out confirmation (not shown on the application's normal sign-out path)
# ---------------------------------------------------------------------------
logoutConfirmTitle=Sign out?
logoutConfirmHeader=You''ll be signed out of Outdoor Trip Companion in this browser.
doLogout=Sign out

# ---------------------------------------------------------------------------
# Forgot password (reachable only while the realm has it enabled)
# ---------------------------------------------------------------------------
emailForgotTitle=Reset your password
emailInstruction=Enter your username or email and we''ll send you a link to choose a new password.
emailInstructionUsername=Enter your username and we''ll send you a link to choose a new password.
