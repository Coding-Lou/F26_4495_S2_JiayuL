# Outdoor Trip Companion: Keycloak login theme (FEATURE-002, sections 11 and 21.5-21.7).
#
# Covers the login theme type only: sign-in, registration, password reset,
# error, page-expired, and logout-confirmation pages. It inherits its templates
# from the official parent theme and overrides exactly one of them,
# login-page-expired.ftl (D28). Everything else it changes is here
# (properties), in resources/css (one stylesheet), in resources/img (the
# browser-tab icon), in resources/js (one script, D29), and in messages (copy).
parent=keycloak.v2

# The parent's stylesheet first, then this theme's, which is written against
# the parent's markup. Nothing is loaded from another origin.
styles=css/styles.css css/outdoor-trip-companion.css

# One appearance. The parent switches to a dark variant under a dark system
# colour scheme; the design system defines no dark mode, so the switch is off.
darkMode=false

# One script, served from this theme and loaded on every page of the login
# flow: it sets focus on the registration page and does nothing anywhere else
# (D29). No other script belongs here.
scripts=js/registration-focus.js
