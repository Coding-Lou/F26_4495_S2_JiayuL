server:
  port: 8083

spring:
  application:
    name: recommendation-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/outdoor-trip

services:
  trail:
    base-url: http://localhost:8082

  user:
    base-url: http://localhost:8081

weather:
  base-url: ${WEATHER_BASE_URL:https://api.open-meteo.com}

openai:
  model: gpt-5.4-mini