apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: activity-service
  namespace: outdoor
spec:
  maxReplicas: 5
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 60
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: activity-service
status:
  currentMetrics: null
  desiredReplicas: 0
