apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: outdoor
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: outdoor
data:
  20-init-databases.sql: |
    CREATE DATABASE user_db;
    CREATE DATABASE trail_db;
    CREATE DATABASE memory_db;
    CREATE DATABASE plan_db;
    CREATE DATABASE keycloak_db;