# Static hosting of the built application. No API routing here: /api/ belongs
# to the host's router (local reverse proxy or Kubernetes Ingress).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # nginx's table has no .mjs; the map's worker (maplibre-gl-worker-*.mjs)
    # is a module worker, which browsers refuse unless served as JavaScript.
    # .glb (avatar and gear models) gets its registered type as well.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        model/gltf-binary glb;
    }

    # Written at container start from the environment (runtime-config.sh).
    location = /runtime-config.js {
        alias /tmp/runtime-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # Hashed build output.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # An API path that reached the static host was routed wrongly; never
    # answer it with the application shell.
    location /api/ {
        return 404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
